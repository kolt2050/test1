<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System See - File Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            padding-bottom: 3rem;
        }

        .controls {
            text-align: center;
            margin-bottom: 3rem;
        }

        .scan-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .scan-btn:active {
            transform: translateY(1px);
        }

        .scan-btn:disabled {
            opacity: 0.7;
            cursor: wait;
            background: var(--text-secondary);
            box-shadow: none;
        }

        .stop-btn {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .header-buttons {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
        }

        .stop-btn {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            /* Position reset because now inside flex container */
            position: static;
        }

        .stop-btn:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        .restart-btn {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .restart-btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .lang-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--text-secondary);
            padding: 0.5rem 0.8rem;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .lang-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .db-controls {
            position: absolute;
            top: 2rem;
            right: 25rem;
            /* Moved further left to accommodate buttons */
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .history-select {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem;
            border-radius: 8px;
            width: 250px;
        }

        .history-select option {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .db-size {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .clear-db-btn {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-db-btn:hover {
            background: var(--warning);
            color: black;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .results.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .count-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 1rem;
            list-style: none;
            padding: 0;
        }

        .file-name {
            color: var(--text-primary);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .path-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-align: center;
            width: 40px;
            overflow: hidden;
            font-family: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            justify-self: end;
        }

        .path-btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        /* Grouping Styles */
        .program-group {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .program-header {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
            user-select: none;
        }

        .program-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .program-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--accent);
            font-weight: 500;
        }

        .program-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.6rem;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .toggle-icon {
            color: var(--text-secondary);
            transition: transform 0.2s;
        }

        .program-group.open .toggle-icon {
            transform: rotate(180deg);
        }

        .group-files {
            display: none;
            padding: 0;
            margin: 0;
            list-style: none;
            background: rgba(0, 0, 0, 0.1);
        }

        .program-group.open .group-files {
            display: block;
        }

        .group-files li {
            padding: 0.6rem 1rem 0.6rem 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .group-files li::before {
            content: '';
            position: absolute;
            left: 1.5rem;
            top: 50%;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translateY(-50%);
        }

        .group-files li:last-child {
            border-bottom: none;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Status Colors */
        .new-files h2 {
            color: var(--success);
        }

        .mod-files h2 {
            color: var(--warning);
        }

        .del-files h2 {
            color: var(--danger);
        }

        .loading {
            display: none;
            margin-top: 1rem;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60% {
                content: '...';
            }
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stat-item strong {
            color: var(--accent);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h3 {
            margin-top: 0;
            color: var(--text-primary);
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .modal p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .modal-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            font-weight: 500;
        }

        .modal-btn:hover {
            opacity: 0.9;
        }

        .modal-btn.confirm {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        .modal-btn.cancel {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
    </style>
</head>

<body>

    <header>
        <h1 data-i18n="app_title">SYSTEM SEE</h1>
        <div style="margin-top: 10px;">
            <select id="historyDropdown" class="history-select">
                <option value="" data-i18n="scan_history_placeholder">Scan History...</option>
            </select>
        </div>
        <div class="db-controls">
            <span class="db-size"><span data-i18n="db_size_label">DB Size:</span> <span id="dbSizeVal">-</span></span>
            <button class="clear-db-btn" onclick="clearDB()" data-i18n="clear_db_btn">Clear DB</button>
        </div>
        <div class="header-buttons">
            <button class="lang-btn" onclick="toggleLanguage()">RU</button>
            <button class="restart-btn" onclick="restartServer()" data-i18n="restart_btn">Restart Server</button>
            <button class="stop-btn" onclick="stopServer()" data-i18n="stop_btn">Stop Server</button>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <button id="scanBtn" class="scan-btn" onclick="startScan()" data-i18n="scan_btn">Scan Drive C:</button>
            <div id="loadingText" class="loading" data-i18n="loading_text">Scanning in progress (this may take a while)
            </div>
        </div>

        <div id="statsBar" class="stats-bar" style="display:none;">
            <div class="stat-item"><span data-i18n="time_label">Time:</span> <strong id="scanDuration">-</strong>s</div>
            <div class="stat-item"><span data-i18n="files_label">Total Files:</span> <strong id="totalFiles">-</strong>
            </div>
        </div>

        <div id="resultsArea" class="results">
            <!-- New Files -->
            <div class="card new-files">
                <h2><span data-i18n="new_files">New Files</span> <span class="count-badge" id="newCount">0</span></h2>
                <ul class="file-list" id="newList">
                    <!-- Items inserted here -->
                </ul>
            </div>

            <!-- Modified Files -->
            <div class="card mod-files">
                <h2><span data-i18n="mod_files">Modified Files</span> <span class="count-badge" id="modCount">0</span>
                </h2>
                <ul class="file-list" id="modList">
                    <!-- Items inserted here -->
                </ul>
            </div>

            <!-- Deleted Files -->
            <div class="card del-files">
                <h2><span data-i18n="del_files">Deleted Files</span> <span class="count-badge" id="delCount">0</span>
                </h2>
                <ul class="file-list" id="delList">
                    <!-- Items inserted here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Confirm Action</h3>
            <p id="modalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="modalConfirmBtn" class="modal-btn confirm" data-i18n="modal_ok">OK</button>
                <button id="modalCancelBtn" class="modal-btn cancel" onclick="closeModal()"
                    data-i18n="modal_cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        async function startScan() {
            const btn = document.getElementById('scanBtn');
            const loading = document.getElementById('loadingText');
            const results = document.getElementById('resultsArea');

            btn.disabled = true;
            btn.textContent = txt('scan_btn_loading');
            loading.style.display = 'block';
            results.classList.remove('visible');

            try {
                const response = await fetch('/scan', { method: 'POST' });
                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                // Update UI
                updateList('newList', 'newCount', data.added);
                updateList('modList', 'modCount', data.modified);
                updateList('delList', 'delCount', data.deleted);

                // Update Stats
                document.getElementById('statsBar').style.display = 'flex';
                document.getElementById('scanDuration').textContent = data.stats.duration;
                document.getElementById('totalFiles').textContent = data.stats.total_files.toLocaleString();

                if (data.note) {
                    // If it's a baseline scan
                    const list = document.getElementById('newList');
                    list.innerHTML = `<li style="text-align:center; font-style:italic;">${data.note}</li>`;
                }

                results.classList.add('visible');
                updateDBSize();
                updateHistory(); // Refresh history list after new scan

            } catch (err) {
                console.error(err);
                alert('Scan failed. See console.');
            } finally {
                btn.disabled = false;
                btn.textContent = txt('scan_btn');
                loading.style.display = 'none';
            }
        }

        function updateList(listId, countId, items) {
            const list = document.getElementById(listId);
            const count = document.getElementById(countId);

            list.innerHTML = '';
            if (!items) items = [];

            // Update total count
            count.textContent = items.length > 1000 ? '1000+' : items.length;

            if (items.length === 0) {
                list.innerHTML = `<div style="padding:1rem">${txt('no_changes')}</div>`;
                return;
            }

            // Group by Program
            const groups = {};
            items.forEach(item => {
                const prog = item.program || txt('unknown');
                if (!groups[prog]) groups[prog] = [];
                groups[prog].push(item);
            });

            // Sort programs by name
            const sortedPrograms = Object.keys(groups).sort();

            // Create UI for groups
            sortedPrograms.forEach(prog => {
                const groupItems = groups[prog];

                const groupDiv = document.createElement('div');
                groupDiv.className = 'program-group';

                // Header
                const header = document.createElement('div');
                header.className = 'program-header';
                header.innerHTML = `
                    <div class="program-title">
                        <span>${prog}</span>
                        <span class="program-count">${groupItems.length}</span>
                    </div>
                    <span class="toggle-icon">&#9662;</span>
                `;

                // Click to toggle
                header.onclick = () => {
                    groupDiv.classList.toggle('open');
                };

                // Files List
                const ul = document.createElement('ul');
                ul.className = 'group-files';

                // Limit items per group to avoid huge DOM if a folder has 10k changes
                const maxItems = 100;
                groupItems.slice(0, maxItems).forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span class="file-name" title="${item.name}">${item.name}</span>
                        <button class="path-btn" onclick="openLocation('${item.path.replace(/\\/g, '\\\\')}')" title="${item.path}">
                            &#10140;
                        </button>
                    `;
                    ul.appendChild(li);
                });

                if (groupItems.length > maxItems) {
                    const moreLi = document.createElement('li');
                    const diff = groupItems.length - maxItems;
                    moreLi.innerHTML = `<em style="color:var(--text-secondary)">${txt('more_files').replace('{n}', diff)}</em>`;
                    ul.appendChild(moreLi);
                }

                groupDiv.appendChild(header);
                groupDiv.appendChild(ul);
                list.appendChild(groupDiv);
            });
        }


        let modalCallback = null;

        function showModal(title, message, onConfirm) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('customModal').classList.add('active');

            // Unbind previous listener to avoid multiple calls
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const newBtn = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);

            newBtn.addEventListener('click', () => {
                closeModal();
                if (onConfirm) onConfirm();
            });
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        async function restartServer() {
            showModal(txt('restart_title'), txt('restart_msg'), async () => {
                try {
                    await fetch('/restart', { method: 'POST' });
                    document.body.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;"><h1>${txt('restart_done_title')}</h1><p>${txt('restart_done_msg')}</p></div>`;
                    setTimeout(() => {
                        location.reload();
                    }, 3000);
                } catch (e) {
                    alert('Error restarting server');
                }
            });
        }

        async function stopServer() {
            showModal(txt('stop_title'), txt('stop_msg'), async () => {
                try {
                    await fetch('/shutdown', { method: 'POST' });
                    document.body.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;"><h1>${txt('stop_done_title')}</h1><p>${txt('stop_done_msg')}</p></div>`;
                } catch (e) {
                    alert('Error stopping server');
                }
            });
        }

        async function openLocation(path) {
            try {
                await fetch('/open_folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function updateDBSize() {
            try {
                const response = await fetch('/db_size');
                const data = await response.json();
                document.getElementById('dbSizeVal').textContent = data.size;
            } catch (e) {
                console.error('Failed to get DB size');
            }
        }

        async function clearDB() {
            showModal(txt('clear_title'), txt('clear_msg'), async () => {
                try {
                    const response = await fetch('/clear_db', { method: 'POST' });
                    const data = await response.json();
                    if (data.status === 'ok') {
                        // alert(txt('db_cleared'));
                        updateDBSize();
                        updateHistory();
                        // Clear UI results
                        document.getElementById('newList').innerHTML = '';
                        document.getElementById('modList').innerHTML = '';
                        document.getElementById('delList').innerHTML = '';
                        document.getElementById('newCount').innerText = '0';
                        document.getElementById('modCount').innerText = '0';
                        document.getElementById('delCount').innerText = '0';
                        document.getElementById('resultsArea').classList.remove('visible');
                        document.getElementById('statsBar').style.display = 'none';
                    }
                } catch (e) {
                    alert('Error clearing database');
                }
            });
        }


        async function updateHistory() {
            try {
                const response = await fetch('/scan_history');
                const scans = await response.json();
                const select = document.getElementById('historyDropdown');
                select.innerHTML = '<option value="">Scan History (Total: ' + scans.length + ')</option>';

                scans.forEach(scan => {
                    const opt = document.createElement('option');
                    opt.value = scan.id;
                    opt.textContent = `${scan.date} (ID: ${scan.id})`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Failed to load history");
            }
        }

        // Translations
        const translations = {
            en: {
                app_title: 'SYSTEM SEE',
                scan_history_placeholder: 'Scan History...',
                db_size_label: 'DB Size:',
                clear_db_btn: 'Clear DB',
                restart_btn: 'Restart Server',
                stop_btn: 'Stop Server',
                scan_btn: 'Scan Drive C:',
                scan_btn_loading: 'Scanning...',
                loading_text: 'Scanning in progress (this may take a while)',
                time_label: 'Time:',
                files_label: 'Total Files:',
                new_files: 'New Files',
                mod_files: 'Modified Files',
                del_files: 'Deleted Files',
                modal_ok: 'OK',
                modal_cancel: 'Cancel',
                restart_title: 'Restart Server',
                restart_msg: 'Are you sure you want to restart the server? The page will reload.',
                stop_title: 'Stop Server',
                stop_msg: 'Are you sure you want to stop the server?',
                clear_title: 'Clear Database',
                clear_msg: 'Are you sure you want to clear the database? All history will be lost.',
                db_cleared: 'Database cleared.',
                stop_done_title: 'Server Stopped',
                stop_done_msg: 'You can close this tab.',

        let currentLang = localStorage.getItem('system_see_lang') || 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            localStorage.setItem('system_see_lang', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const t = translations[currentLang];
            const btn = document.querySelector('.lang-btn');

            // Update Toggle Button Text (Show the other language as option)
            btn.textContent = currentLang === 'en' ? 'RU' : 'EN';

            // Update static elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            // Update Scan Button specific state if not disabled
            const scanBtn = document.getElementById('scanBtn');
            if (scanBtn && !scanBtn.disabled) {
                scanBtn.textContent = t.scan_btn;
            }

            // Update history dropdown placeholder (first option)
            const dropdown = document.getElementById('historyDropdown');
            if (dropdown && dropdown.options.length > 0) {
                const firstOpt = dropdown.options[0];
                if (firstOpt.value === "") {
                    // Only update if it's the placeholder, preserve total count if needed or re-render
                    // For simplicity, we just check if it contains 'Total'
                    if (firstOpt.textContent.includes('(')) {
                        // Keep the count
                        const count = firstOpt.textContent.match(/\d+/)[0];
                        firstOpt.textContent = t.scan_history_placeholder.replace('...', '') + ` (Total: ${count})`;
                    } else {
                        firstOpt.textContent = t.scan_history_placeholder;
                    }
                }
            }
        }

        // --- Update existing functions to use translations ---
        // We override the button text logic in startScan
        // And messages in modals

        // Helper to get text safely
        function txt(key) {
            return translations[currentLang][key] || key;
        }

        // Init DB size on load
        updateDBSize();
        updateHistory();
        applyLanguage();
    </script>
