<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Press Start 2P', cursive;
            color: #e94560;
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 0 0 10px #e94560, 0 0 20px #e94560;
            letter-spacing: 4px;
        }
        
        .game-container {
            position: relative;
            background: linear-gradient(145deg, #0d1b2a, #1b263b);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 
                0 0 0 4px #e94560,
                0 0 30px rgba(233, 69, 96, 0.3),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        
        canvas {
            display: block;
            background: #0d1b2a;
            border-radius: 8px;
        }
        
        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
        }
        
        .score {
            font-size: 14px;
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
        }
        
        .high-score {
            font-size: 12px;
            color: #ffd700;
            text-shadow: 0 0 8px #ffd700;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        .controls p {
            font-size: 10px;
            color: #a0a0a0;
            margin: 5px 0;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 3px solid #e94560;
            display: none;
            z-index: 10;
        }
        
        .game-over h2 {
            color: #e94560;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #e94560;
        }
        
        .game-over p {
            color: #00ff88;
            font-size: 14px;
            margin-bottom: 25px;
        }
        
        .restart-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            padding: 15px 30px;
            background: linear-gradient(145deg, #e94560, #c73e54);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
        }
        
        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 3px solid #00ff88;
            z-index: 10;
        }
        
        .start-screen h2 {
            color: #00ff88;
            font-size: 18px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff88;
        }
        
        .start-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            padding: 18px 40px;
            background: linear-gradient(145deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 10px;
        }
        
        .mobile-btn {
            width: 60px;
            height: 60px;
            font-size: 24px;
            background: rgba(233, 69, 96, 0.3);
            border: 2px solid #e94560;
            border-radius: 12px;
            color: #e94560;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .mobile-btn:active {
            background: #e94560;
            color: white;
        }
        
        .mobile-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        @media (max-width: 500px) {
            .mobile-controls {
                display: block;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <h1>🐍 ЗМЕЙКА</h1>
    
    <div class="game-container">
        <div class="score-panel">
            <span class="score">СЧЁТ: <span id="score">0</span></span>
            <span class="high-score">РЕКОРД: <span id="highScore">0</span></span>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="start-screen" id="startScreen">
            <h2>ГОТОВ ИГРАТЬ?</h2>
            <button class="start-btn" id="startBtn">СТАРТ</button>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <p>Ваш счёт: <span id="finalScore">0</span></p>
            <button class="restart-btn" id="restartBtn">ЗАНОВО</button>
        </div>
    </div>
    
    <div class="controls">
        <p>Управление: ← ↑ → ↓ или WASD</p>
    </div>
    
    <div class="mobile-controls">
        <div class="mobile-row">
            <button class="mobile-btn" id="upBtn">↑</button>
        </div>
        <div class="mobile-row">
            <button class="mobile-btn" id="leftBtn">←</button>
            <button class="mobile-btn" id="downBtn">↓</button>
            <button class="mobile-btn" id="rightBtn">→</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverScreen = document.getElementById('gameOver');
        const startScreen = document.getElementById('startScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let gameSpeed = 100;
        let isGameRunning = false;

        highScoreElement.textContent = highScore;

        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = 100;
            scoreElement.textContent = score;
            placeFood();
        }

        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function draw() {
            // Clear canvas with gradient
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0d1b2a');
            gradient.addColorStop(1, '#1b263b');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food with glow
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw snake
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                
                // Gradient color from head to tail
                const hue = 140 + (index * 2);
                const lightness = 60 - (index * 1.5);
                ctx.fillStyle = `hsl(${hue}, 80%, ${Math.max(lightness, 30)}%)`;
                
                if (isHead) {
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 10;
                }
                
                // Rounded rectangle for each segment
                const x = segment.x * gridSize + 1;
                const y = segment.y * gridSize + 1;
                const size = gridSize - 2;
                const radius = isHead ? 6 : 4;
                
                ctx.beginPath();
                ctx.roundRect(x, y, size, size, radius);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                
                // Draw eyes on head
                if (isHead) {
                    ctx.fillStyle = '#fff';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    let eye1X, eye1Y, eye2X, eye2Y;
                    
                    if (direction.x === 1) { // Right
                        eye1X = x + size - eyeOffset;
                        eye1Y = y + eyeOffset;
                        eye2X = x + size - eyeOffset;
                        eye2Y = y + size - eyeOffset;
                    } else if (direction.x === -1) { // Left
                        eye1X = x + eyeOffset;
                        eye1Y = y + eyeOffset;
                        eye2X = x + eyeOffset;
                        eye2Y = y + size - eyeOffset;
                    } else if (direction.y === -1) { // Up
                        eye1X = x + eyeOffset;
                        eye1Y = y + eyeOffset;
                        eye2X = x + size - eyeOffset;
                        eye2Y = y + eyeOffset;
                    } else { // Down
                        eye1X = x + eyeOffset;
                        eye1Y = y + size - eyeOffset;
                        eye2X = x + size - eyeOffset;
                        eye2Y = y + size - eyeOffset;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function update() {
            direction = { ...nextDirection };
            
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                placeFood();
                
                // Speed up
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
            } else {
                snake.pop();
            }
        }

        function gameStep() {
            update();
            draw();
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            initGame();
            draw();
            isGameRunning = true;
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // Mobile controls
        document.getElementById('upBtn').addEventListener('click', () => {
            if (isGameRunning && direction.y !== 1) nextDirection = { x: 0, y: -1 };
        });
        document.getElementById('downBtn').addEventListener('click', () => {
            if (isGameRunning && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        });
        document.getElementById('leftBtn').addEventListener('click', () => {
            if (isGameRunning && direction.x !== 1) nextDirection = { x: -1, y: 0 };
        });
        document.getElementById('rightBtn').addEventListener('click', () => {
            if (isGameRunning && direction.x !== -1) nextDirection = { x: 1, y: 0 };
        });

        // Button handlers
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initial draw
        initGame();
        draw();
    </script>
</body>
</html>
