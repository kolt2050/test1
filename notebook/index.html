<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Записная книжка</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>Заметки</h1>
                <div class="header-actions">
                    <button id="theme-toggle" class="icon-btn theme-btn" title="Переключить тему">
                        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    <button id="add-btn" class="icon-btn" title="Добавить документ">+</button>
                </div>
            </header>
            <div id="doc-list" class="doc-list">
                <!-- Заголовки документов будут здесь -->
            </div>
            <footer class="sidebar-footer">
                <button id="import-btn" class="secondary-btn" style="margin-bottom: 10px;">Импорт HTML</button>
                <div class="export-group">
                    <button id="export-all-btn" class="secondary-btn">Экспорт всех (HTML)</button>
                </div>
            </footer>
        </aside>

        <main class="editor-area">
            <div id="no-selection" class="no-selection">
                <p>Выберите документ или создайте новый</p>
            </div>
            <div id="active-editor" class="active-editor hidden">
                <header class="toolbar-wrapper">
                    <div class="toolbar glass">
                        <div class="tool-group">
                            <button id="btn-bold" title="Жирный"><b>B</b></button>
                            <button id="btn-italic" title="Курсив"><i>I</i></button>
                            <button id="btn-underline" title="Подчеркнутый"><u>U</u></button>
                        </div>
                        <div class="tool-group">
                            <button id="btn-left" title="По левому краю">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="17" y1="10" x2="3" y2="10"></line>
                                    <line x1="21" y1="6" x2="3" y2="6"></line>
                                    <line x1="21" y1="14" x2="3" y2="14"></line>
                                    <line x1="17" y1="18" x2="3" y2="18"></line>
                                </svg>
                            </button>
                            <button id="btn-center" title="По центру">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="18" y1="10" x2="6" y2="10"></line>
                                    <line x1="21" y1="6" x2="3" y2="3"></line>
                                    <line x1="21" y1="14" x2="3" y2="14"></line>
                                    <line x1="18" y1="18" x2="6" y2="18"></line>
                                </svg>
                            </button>
                            <button id="btn-right" title="По правому краю">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="21" y1="10" x2="7" y2="10"></line>
                                    <line x1="21" y1="6" x2="3" y2="6"></line>
                                    <line x1="21" y1="14" x2="3" y2="14"></line>
                                    <line x1="21" y1="18" x2="7" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="tool-group">
                            <button id="export-selected-btn" title="Экспорт в HTML">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </button>
                            <button id="delete-btn" class="danger-btn-small" title="Удалить документ">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </header>
                <div class="editor-content-scroll">
                    <div class="editor-header">
                        <input type="text" id="doc-title-input" placeholder="Заголовок документа...">
                    </div>
                    <div id="doc-content-editor" contenteditable="true" class="paper"
                        placeholder="Введите содержание документа..."></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <p id="confirm-message">Вы уверены?</p>
            <div class="modal-buttons">
                <button id="confirm-yes" class="modal-btn confirm-btn">Да, удалить</button>
                <button id="confirm-no" class="modal-btn cancel-btn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="image-input" accept="image/*" style="display: none;">
    <input type="file" id="file-input" accept=".html" style="display: none;">

    <!-- Link Bubble (Google Docs style) -->
    <div id="link-bubble" class="link-bubble glass shadow" style="display: none;">
        <a href="#" id="bubble-url" target="_blank" class="bubble-link">URL</a>
        <div class="bubble-divider"></div>
        <div class="bubble-actions">
            <button id="btn-copy-link" title="Копировать ссылку">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            <button id="btn-edit-link" title="Изменить ссылку">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>
            <button id="btn-unlink" title="Удалить ссылку">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
