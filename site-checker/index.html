<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка доступности сайтов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #e8e8e8;
        }

        .add-site-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .add-site-form input {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #3a3a5c;
            border-radius: 8px;
            background: #252545;
            color: #fff;
            width: 300px;
            outline: none;
            transition: border-color 0.3s;
        }

        .add-site-form input:focus {
            border-color: #6c63ff;
        }

        .add-site-form input::placeholder {
            color: #888;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-add {
            background: #6c63ff;
            color: #fff;
        }

        .btn-add:hover {
            background: #5a52d5;
            transform: translateY(-2px);
        }

        .btn-check-all {
            background: #00b894;
            color: #fff;
        }

        .btn-check-all:hover {
            background: #00a085;
            transform: translateY(-2px);
        }

        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .site-card {
            background: #252545;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
            transition: all 0.3s;
            border: 3px solid #3a3a5c;
        }

        .site-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .site-card.online {
            border-color: #00b894;
            background: linear-gradient(135deg, #252545 0%, #1a3a2e 100%);
        }

        .site-card.offline {
            border-color: #e74c3c;
            background: linear-gradient(135deg, #252545 0%, #3a1a1a 100%);
        }

        .site-card.checking {
            border-color: #f39c12;
        }

        .site-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .site-status {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
        }

        .site-card.online .site-status {
            color: #00b894;
        }

        .site-card.offline .site-status {
            color: #e74c3c;
        }

        .site-card.checking .site-status {
            color: #f39c12;
        }

        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            right: 15px;
            background: #3a3a5c;
        }

        .site-card.online .status-indicator {
            background: #00b894;
            box-shadow: 0 0 10px #00b894;
        }

        .site-card.offline .status-indicator {
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
        }

        .site-card.checking .status-indicator {
            background: #f39c12;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-delete {
            position: absolute;
            top: 10px;
            left: 10px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            opacity: 0;
            transition: opacity 0.3s, color 0.3s;
        }

        .site-card:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            color: #e74c3c;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state p {
            font-size: 1.2rem;
        }

        .response-time {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }

        .site-card.online .response-time {
            color: #00b894;
        }

        .note {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(108, 99, 255, 0.1);
            border-radius: 8px;
            color: #888;
            font-size: 0.9rem;
        }

        .note strong {
            color: #6c63ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Проверка доступности сайтов</h1>
        
        <form class="add-site-form" id="addSiteForm">
            <input type="text" id="siteInput" placeholder="Введите адрес сайта (например: google.com)" autocomplete="off">
            <button type="submit" class="btn btn-add">Добавить</button>
        </form>

        <div class="actions">
            <button class="btn btn-check-all" id="checkAllBtn">Проверить все</button>
        </div>

        <div class="sites-grid" id="sitesGrid"></div>

        <div class="note">
            <strong>Примечание:</strong> Из-за ограничений безопасности браузера (CORS), проверка осуществляется 
            попыткой загрузки favicon сайта. Некоторые сайты могут показывать неверный статус.
            Для более точной проверки рекомендуется использовать серверную часть.
        </div>
    </div>

    <script>
        // Конфигурация по умолчанию
        const DEFAULT_SITES = ['ya.ru', 'rutor.info'];
        const STORAGE_KEY = 'site-checker-config';

        // Загрузка конфигурации
        function loadConfig() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error('Ошибка загрузки конфигурации:', e);
                }
            }
            return { sites: [...DEFAULT_SITES] };
        }

        // Сохранение конфигурации
        function saveConfig(config) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        }

        // Текущая конфигурация
        let config = loadConfig();

        // DOM элементы
        const sitesGrid = document.getElementById('sitesGrid');
        const addSiteForm = document.getElementById('addSiteForm');
        const siteInput = document.getElementById('siteInput');
        const checkAllBtn = document.getElementById('checkAllBtn');

        // Нормализация URL
        function normalizeSite(site) {
            site = site.trim().toLowerCase();
            site = site.replace(/^https?:\/\//, '');
            site = site.replace(/\/+$/, '');
            return site;
        }

        // Проверка доступности сайта
        async function checkSite(site) {
            const startTime = Date.now();
            
            return new Promise((resolve) => {
                // Метод 1: Попытка загрузить favicon через Image
                const img = new Image();
                const timeout = setTimeout(() => {
                    img.onload = img.onerror = null;
                    resolve({ online: false, time: null });
                }, 5000);

                img.onload = () => {
                    clearTimeout(timeout);
                    resolve({ online: true, time: Date.now() - startTime });
                };

                img.onerror = () => {
                    clearTimeout(timeout);
                    // Попробуем другой метод - fetch с no-cors
                    checkWithFetch(site, startTime).then(resolve);
                };

                // Пробуем разные пути к favicon
                img.src = `https://${site}/favicon.ico?_=${Date.now()}`;
            });
        }

        // Альтернативная проверка через fetch
        async function checkWithFetch(site, startTime) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                
                await fetch(`https://${site}`, {
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeout);
                return { online: true, time: Date.now() - startTime };
            } catch (e) {
                return { online: false, time: null };
            }
        }

        // Создание карточки сайта
        function createSiteCard(site) {
            const card = document.createElement('div');
            card.className = 'site-card';
            card.dataset.site = site;
            card.innerHTML = `
                <button class="btn-delete" title="Удалить">✕</button>
                <div class="status-indicator"></div>
                <div class="site-name">${site}</div>
                <div class="site-status">Не проверен</div>
                <div class="response-time"></div>
            `;

            // Удаление сайта
            card.querySelector('.btn-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                removeSite(site);
            });

            // Проверка по клику на карточку
            card.addEventListener('click', () => {
                checkSingleSite(site);
            });

            return card;
        }

        // Обновление статуса карточки
        function updateCardStatus(site, status, responseTime = null) {
            const card = sitesGrid.querySelector(`[data-site="${site}"]`);
            if (!card) return;

            card.className = 'site-card ' + status;
            const statusEl = card.querySelector('.site-status');
            const timeEl = card.querySelector('.response-time');

            switch (status) {
                case 'checking':
                    statusEl.textContent = 'Проверка...';
                    timeEl.textContent = '';
                    break;
                case 'online':
                    statusEl.textContent = 'Доступен';
                    timeEl.textContent = responseTime ? `${responseTime} мс` : '';
                    break;
                case 'offline':
                    statusEl.textContent = 'Недоступен';
                    timeEl.textContent = '';
                    break;
            }
        }

        // Проверка одного сайта
        async function checkSingleSite(site) {
            updateCardStatus(site, 'checking');
            const result = await checkSite(site);
            updateCardStatus(site, result.online ? 'online' : 'offline', result.time);
        }

        // Проверка всех сайтов
        async function checkAllSites() {
            checkAllBtn.disabled = true;
            checkAllBtn.textContent = 'Проверка...';

            for (const site of config.sites) {
                updateCardStatus(site, 'checking');
            }

            const promises = config.sites.map(async (site) => {
                const result = await checkSite(site);
                updateCardStatus(site, result.online ? 'online' : 'offline', result.time);
            });

            await Promise.all(promises);

            checkAllBtn.disabled = false;
            checkAllBtn.textContent = 'Проверить все';
        }

        // Добавление сайта
        function addSite(site) {
            site = normalizeSite(site);
            
            if (!site) {
                alert('Введите адрес сайта');
                return;
            }

            if (config.sites.includes(site)) {
                alert('Этот сайт уже добавлен');
                return;
            }

            config.sites.push(site);
            saveConfig(config);
            
            const card = createSiteCard(site);
            sitesGrid.appendChild(card);
            
            // Сразу проверяем новый сайт
            checkSingleSite(site);
        }

        // Удаление сайта
        function removeSite(site) {
            config.sites = config.sites.filter(s => s !== site);
            saveConfig(config);
            
            const card = sitesGrid.querySelector(`[data-site="${site}"]`);
            if (card) {
                card.remove();
            }
        }

        // Рендер всех сайтов
        function renderSites() {
            sitesGrid.innerHTML = '';
            
            if (config.sites.length === 0) {
                sitesGrid.innerHTML = '<div class="empty-state"><p>Нет добавленных сайтов</p></div>';
                return;
            }

            config.sites.forEach(site => {
                sitesGrid.appendChild(createSiteCard(site));
            });
        }

        // Обработчики событий
        addSiteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            addSite(siteInput.value);
            siteInput.value = '';
        });

        checkAllBtn.addEventListener('click', checkAllSites);

        // Инициализация
        renderSites();
        
        // Автоматическая проверка при загрузке
        setTimeout(checkAllSites, 500);
    </script>
</body>
</html>
