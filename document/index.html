<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Премиальный Редактор Документов</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="toolbar-wrapper">
            <div class="toolbar glass">
                <div class="tool-group">
                    <button id="btn-bold" title="Жирный"><b>B</b></button>
                    <button id="btn-italic" title="Курсив"><i>I</i></button>
                    <button id="btn-underline" title="Подчеркнутый"><u>U</u></button>
                    <div class="tool-group">
                        <button id="btn-left" title="По левому краю">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="17" y1="10" x2="3" y2="10"></line>
                                <line x1="21" y1="6" x2="3" y2="6"></line>
                                <line x1="21" y1="14" x2="3" y2="14"></line>
                                <line x1="17" y1="18" x2="3" y2="18"></line>
                            </svg>
                        </button>
                        <button id="btn-center" title="По центру">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="18" y1="10" x2="6" y2="10"></line>
                                <line x1="21" y1="6" x2="3" y2="6"></line>
                                <line x1="21" y1="14" x2="3" y2="14"></line>
                                <line x1="18" y1="18" x2="6" y2="18"></line>
                            </svg>
                        </button>
                        <button id="btn-right" title="По правому краю">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="21" y1="10" x2="7" y2="10"></line>
                                <line x1="21" y1="6" x2="3" y2="6"></line>
                                <line x1="21" y1="14" x2="3" y2="14"></line>
                                <line x1="21" y1="18" x2="7" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="tool-group">
                        <button id="btn-open" class="secondary-btn" title="Открыть документ (.html)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 13l5 5 5-5M12 18V6"></path>
                            </svg>
                        </button>
                        <button id="btn-save" class="secondary-btn" title="Сохранить как HTML">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                <polyline points="7 3 7 8 15 8"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
        </header>

        <main class="editor-container">
            <div id="editor" contenteditable="true" class="paper shadow">
                <p>Этот документ теперь максимально прост. Вы можете использовать <b>жирный текст</b>, <i>курсив</i> и
                    <u>подчеркивание</u>.
                </p>
                <p>Все настройки выравнивания и межстрочный интервал (1.5) уже оптимизированы для вас.</p>
                <p>Нажмите кнопку с иконкой дискеты, чтобы сохранить результат.</p>
            </div>
        </main>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="image-input" accept="image/*" style="display: none;">
    <input type="file" id="file-input" accept=".html" style="display: none;">

    <script src="script.js"></script>

    <!-- Link Bubble (Google Docs style) -->
    <div id="link-bubble" class="link-bubble glass shadow" style="display: none;">
        <a href="#" id="bubble-url" target="_blank" class="bubble-link">URL</a>
        <div class="bubble-divider"></div>
        <div class="bubble-actions">
            <button id="btn-copy-link" title="Копировать ссылку">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            <button id="btn-edit-link" title="Изменить ссылку">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>
            <button id="btn-unlink" title="Удалить ссылку">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

</body>

</html>
